<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>m3rzo — разработка сайтов</title>
  <meta name="description" content="Создание сайтов на заказ. Лендинги, магазины, портфолио.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <canvas id="bg"></canvas>
  <div id="spotlight" aria-hidden="true"></div>

  <header class="site-header">
    <a href="#/" class="logo">m3<span>rzo</span></a>
    <nav id="nav">
      <a href="#/" data-route="#/">Главная</a>
      <a href="#/about" data-route="#/about">Обо мне</a>
      <a href="#/order" data-route="#/order" class="nav-cta">Сделать заказ</a>
    </nav>
  </header>

  <main id="app"></main>

  <div id="toast-root"></div>

  <footer class="site-footer">
    <span>© 2026 m3rzo</span>
    <a href="https://t.me/m3rzo" target="_blank" rel="noopener">Telegram: @m3rzo</a>
  </footer>

  <!-- Чат-виджет: вне #app, чтобы жить при переключении вкладок -->
  <div id="chat-widget">
    <button id="chat-toggle" title="Чат с разработчиком" aria-label="Открыть чат">
      <span class="chat-toggle-icon">💬</span>
      <span id="chat-unread-dot" hidden></span>
    </button>
    <div id="chat-panel" hidden>
      <div class="chat-header">
        <div>
          <div class="chat-title">Чат с m3rzo</div>
          <div id="chat-status-line" class="chat-subtitle">Напишите мне — отвечаю быстро</div>
        </div>
        <button id="chat-close" aria-label="Закрыть чат">✕</button>
      </div>
      <div id="chat-messages"></div>
      <form id="chat-form">
        <input id="chat-input" type="text" placeholder="Ваше сообщение..." maxlength="4000" autocomplete="off">
        <button type="submit" aria-label="Отправить">➤</button>
      </form>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
